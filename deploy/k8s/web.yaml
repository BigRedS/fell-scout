apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/bigreds/fell-scout
          # Listen on IPv6 as well: on an IPv6-first cluster (e.g. farfaraway)
          # the pod IP, Service and kubelet probes are all IPv6, and plackup's
          # default of 0:5000 is IPv4-only. "::" takes IPv4 too. Not in the
          # image's ENTRYPOINT because binding "::" fails on Docker's default
          # (IPv4-only) network, which compose uses.
          args: ["--host", "::", "--port", "5000", "--ipv6", "1", "bin/app.psgi"]
          env:
            - name: MYSQL_HOST
              value: db
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: fellscout
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fellscout-db
                  key: password
            - name: SKIP_FETCH_FROM_FELLTRACK
              value: "1"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5000
            periodSeconds: 10
