apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/bigreds/fell-scout
          # Listen on IPv6 as well: on an IPv6-first cluster (e.g. farfaraway)
          # the pod IP, Service and kubelet probes are all IPv6, and the
          # image's default of 0.0.0.0 is IPv4-only. A bare ":5000" makes
          # Net::Server bind [::], which takes IPv4 too. Not the image's
          # default because that bind fails on Docker's default (IPv4-only)
          # network, which compose uses.
          args: ["--listen", ":5000", "bin/app.psgi"]
          env:
            - name: MYSQL_HOST
              value: db
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: fellscout
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fellscout-db
                  key: password
            # Times from FellTrack are local, and are parsed and shown with
            # localtime. db.yaml sets the same.
            - name: TZ
              value: Europe/London
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5000
            periodSeconds: 10
