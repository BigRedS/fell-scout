# Not applied by kustomization.yaml - create these by hand, once:
#
#   kubectl create namespace fellscout
#   kubectl -n fellscout create secret generic fellscout-db \
#     --from-literal=password="$(openssl rand -base64 24)"
#   htpasswd -c users <username>      # repeat without -c for more users
#   kubectl -n fellscout create secret generic fellscout-htpasswd --from-file=users
#
# Mariadb only reads the password when it first initialises its volume, so
# changing fellscout-db later won't change the database's password.
#
# Roughly what that produces:
apiVersion: v1
kind: Secret
metadata:
  name: fellscout-db
  namespace: fellscout
stringData:
  password: changeme
---
apiVersion: v1
kind: Secret
metadata:
  name: fellscout-htpasswd
  namespace: fellscout
stringData:
  users: |
    admin:$apr1$...
