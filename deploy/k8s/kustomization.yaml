# A base, to be pulled in by the repo that actually deploys it, e.g.
#   resources:
#     - github.com/BigRedS/fell-scout//deploy/k8s?ref=master
# See ../README.md for what that repo has to provide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fellscout

# No Namespace or Ingress here - those are cluster-specific, so they belong to
# the deploying repo, as do the fellscout-db and fellscout-htpasswd Secrets.
resources:
  - db.yaml
  - web.yaml
  - cron.yaml
  - auth.yaml

# all.sql is a copy of build/sql/all.sql, because kustomize won't read files
# outside this directory - not even with --load-restrictor once this is
# pulled in remotely. FellScout/t/044_k8s_schema_copy.t fails if they drift.
#
# MariaDB only runs it on an empty data dir. No hash suffix: a suffix would
# change with every schema edit, renaming the ConfigMap and so restarting
# the db for nothing.
configMapGenerator:
  - name: schema
    files:
      - all.sql
    options:
      disableNameSuffixHash: true

# The deploying repo should pin this to a sha-<short> tag from CI, so a
# rollout is a deliberate change and `kubectl rollout undo` means something.
images:
  - name: ghcr.io/bigreds/fell-scout
    newTag: latest
