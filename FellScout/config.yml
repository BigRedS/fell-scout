# This is the main configuration file of your Dancer2 app
# env-related settings should go to environments/$env.yml
# all the settings in this file will be loaded at Dancer's startup.

# Your application's name
appname: "FellScout"

# when the charset is set to UTF-8 Dancer2 will handle for you
# all the magic of encoding and decoding. You should not care
# about unicode within your app when this setting is set (recommended).
charset: "UTF-8"

# The whole app is JSON APIs + a static SPA shell (see FellScout.pm's
# catch-all route) - no server-side templates, so no template engine is
# configured.

logger: "File"
engines:
  session:
    Simple:
      cookie_name: FellScout
  logger:
    File:
      log_dir: "/home/avi/logs/"
      file_name: "fellscout.log"
progress_csv_path: ../progress.csv
commands:
  progress_to_json_args: --teams --entrants


plugins:
  Database:
    driver: 'mysql'
    connection_check_threshold: 10
    dbi_params:
      RaiseError: 1
      AutoCommit: 1
    on_connect_do: ["SET NAMES 'utf8'", "SET CHARACTER SET 'utf8'" ]
    log_queries: 1
