# compose.dev.yaml's stand-in for the production auth proxy: basic auth
# against ./htpasswd, then the authed username passed on in X-Remote-User.
# proxy_set_header replaces any X-Remote-User the client sent, so it can't be
# spoofed through here.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;

	location / {
		auth_basic           "FellScout (dev)";
		auth_basic_user_file /etc/nginx/htpasswd;

		proxy_pass http://frontend:5173;
		proxy_http_version 1.1;
		proxy_set_header Host            $http_host;
		proxy_set_header X-Remote-User   $remote_user;
		# Vite's HMR websocket
		proxy_set_header Upgrade         $http_upgrade;
		proxy_set_header Connection      $connection_upgrade;
	}
}
