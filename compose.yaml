services:
  web:
    build:
      context: .
      dockerfile: ./build/dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=supersecret
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=fellscout
      - SKIP_FETCH_FROM_FELLTRACK=1

  db:
    image: "mariadb:11.8"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: supersecret
    volumes:
      - fellscout_db:/var/lib/mysql
      - ./build/sql:/docker-entrypoint-initdb.d

  db-test:
    image: "mariadb:11.8"
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: fellscout
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./build/sql:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/mysql

  cron:
    build:
      context: build/
      dockerfile: ./cron.dockerfile
    environment:
      - CRON_INTERVAL_SECONDS=60
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=supersecret
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=fellscout
      - SKIP_FETCH_FROM_FELLTRACK=1

volumes:
  fellscout_db:
