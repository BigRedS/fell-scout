# Test/dev infrastructure only: the throwaway database the test suite and
# ./dev.sh use. The production stack is in deploy/compose.yaml.

# A separate project from deploy/compose.yaml's ("fell-scout"), so that a
# `docker compose down` here can't take the production stack with it.
name: fell-scout-test

services:
  db-test:
    image: "mariadb:11.8"
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: fellscout
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./build/sql:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/mysql
